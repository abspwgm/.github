name: brand-drift

# brand/ is vendored from a private repository, so CI cannot re-fetch it to see
# whether it is current. What it can prove is that nobody edited the vendored
# copy in place — which is the drift that actually happens. Clause 1.3: anything
# that can drift is guarded by a check, not by discipline.

on:
  push:
    paths: ['brand/**', 'scripts/sync_brand.py', '.github/workflows/brand-drift.yml']
  pull_request:
    paths: ['brand/**', 'scripts/sync_brand.py', '.github/workflows/brand-drift.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 scripts/sync_brand.py --check
