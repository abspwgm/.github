name: Bug report
description: Something behaves differently from what the documentation says
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Security problems do not go here. Use **Report a vulnerability** on the
        Security tab so the report stays private.
  - type: input
    id: version
    attributes:
      label: Version
      description: Image tag, release tag, or commit SHA. "latest" is not a version — say which one it resolved to.
      placeholder: "v1.4.2, or ghcr.io/abspwgm/…@sha256:…"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: The smallest sequence that shows it. A compose file or command line beats a description.
      render: shell
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: The relevant lines, not the whole file. Remove tokens, passwords, IP addresses and world data first.
      render: shell
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS and version, Docker or Podman version, architecture. For an app, the platform and OS version.
      placeholder: "Ubuntu 24.04, Docker 27.3, amd64"
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Before you file
      options:
        - label: I checked that this is not already an open issue
          required: true
        - label: This report contains no credentials, tokens or personal data
          required: true
