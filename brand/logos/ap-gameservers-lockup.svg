<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" font-family="Rajdhani, 'Arial Narrow', sans-serif">
  <!-- Sub-brand lockup: Absolute Power Game Servers.
       Per BRAND_GUIDELINES.md §7 the sub-brands share one visual system and are
       distinguished by wordmark only — same palette, same type, same motifs. -->
  <defs>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2F3F5"/>
      <stop offset="0.45" stop-color="#B9BEC7"/>
      <stop offset="0.55" stop-color="#6E7480"/>
      <stop offset="1" stop-color="#F2F3F5"/>
    </linearGradient>
    <linearGradient id="volt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4C1D95"/>
      <stop offset="0.5" stop-color="#8B2FE8"/>
      <stop offset="1" stop-color="#B45CFF"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="220" fill="#070310"/>

  <!-- faint coordinate grid, corner-anchored -->
  <g stroke="#4C1D95" stroke-width="1" opacity="0.15">
    <path d="M0 180 H900 M0 148 H900 M0 116 H900"/>
    <path d="M60 100 V220 M92 100 V220 M124 100 V220 M156 100 V220"/>
  </g>

  <!-- |ABSOLUTE|^ -->
  <g filter="url(#glow)">
    <text x="60" y="105" font-size="92" font-weight="700" fill="url(#volt)">|</text>
    <text x="506" y="105" font-size="92" font-weight="700" fill="url(#volt)">|</text>
    <text x="534" y="72" font-size="58" font-weight="700" fill="url(#volt)">^</text>
  </g>
  <text x="92" y="105" font-size="88" font-weight="700" letter-spacing="6" fill="url(#chrome)">ABSOLUTE</text>

  <!-- GAME SERVERS -->
  <text x="92" y="185" font-size="46" font-weight="600" letter-spacing="11" fill="url(#volt)" filter="url(#glow)">GAME SERVERS</text>

  <!-- piecewise flourish -->
  <g font-family="'STIX Two Text', 'Times New Roman', serif" font-style="italic" font-size="17" fill="#B45CFF" opacity="0.6">
    <text x="762" y="150">x, x ≥ 0</text>
    <text x="756" y="172">−x, x &lt; 0</text>
    <path d="M750 132 q-8 12 0 24 q-4 6 0 12 q-8 12 0 24" stroke="#B45CFF" fill="none" stroke-width="1.4"/>
  </g>
</svg>
