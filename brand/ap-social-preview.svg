<!-- VENDORED — do not edit by hand.
     Source of truth: absolute-power-brand/logos/ap-social-preview.svg
     Resync: bash scripts/sync-brand-assets.sh -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" font-family="Rajdhani, 'Arial Narrow', sans-serif">
  <!-- Social preview / Open Graph card, 1280x640 (GitHub's repository and
       organization social preview size; also serviceable as an OG image).
       Composition is the lockup geometry translated onto a void radial ground. -->
  <defs>
    <radialGradient id="void" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0" stop-color="#1F1233"/>
      <stop offset="0.7" stop-color="#070310"/>
    </radialGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2F3F5"/>
      <stop offset="0.45" stop-color="#B9BEC7"/>
      <stop offset="0.55" stop-color="#6E7480"/>
      <stop offset="1" stop-color="#F2F3F5"/>
    </linearGradient>
    <linearGradient id="volt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4C1D95"/>
      <stop offset="0.5" stop-color="#8B2FE8"/>
      <stop offset="1" stop-color="#B45CFF"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#void)"/>

  <!-- coordinate grid, corner-anchored and low opacity (§6) -->
  <g stroke="#4C1D95" stroke-width="1" opacity="0.14">
    <path d="M0 544 H1280 M0 576 H1280 M0 608 H1280 M0 512 H1280"/>
    <path d="M64 480 V640 M96 480 V640 M128 480 V640 M160 480 V640"/>
  </g>

  <!-- |ABSOLUTE|^ GAMING — lockup geometry, translated to centre -->
  <g transform="translate(215 180)">
    <g filter="url(#glow)">
      <text x="60" y="105" font-size="92" font-weight="700" fill="url(#volt)">|</text>
      <text x="720" y="105" font-size="92" font-weight="700" fill="url(#volt)">|</text>
      <text x="748" y="72" font-size="58" font-weight="700" fill="url(#volt)">^</text>
    </g>
    <text x="92" y="105" font-size="88" font-weight="700" letter-spacing="6" fill="url(#chrome)">ABSOLUTE</text>
    <text x="92" y="185" font-size="56" font-weight="600" letter-spacing="22" fill="url(#volt)" filter="url(#glow)">GAMING</text>
  </g>

  <text x="640" y="470" text-anchor="middle" font-size="26" font-weight="600"
        letter-spacing="3" fill="#B9BEC7">DEDICATED GAME SERVERS · COLLECTION TOOLING · OPEN ENGINEERING STANDARD</text>

  <!-- piecewise flourish (§4), watermark opacity -->
  <g font-family="'STIX Two Text', 'Times New Roman', serif" font-style="italic"
     font-size="22" fill="#B45CFF" opacity="0.15">
    <text x="1078" y="556">x, x ≥ 0</text>
    <text x="1070" y="586">−x, x &lt; 0</text>
    <path d="M1062 532 q-10 15 0 30 q-5 8 0 15 q-10 15 0 30" stroke="#B45CFF" fill="none" stroke-width="1.6"/>
  </g>
</svg>
