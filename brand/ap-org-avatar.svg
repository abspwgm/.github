<!-- VENDORED — do not edit by hand.
     Source of truth: absolute-power-brand/logos/ap-org-avatar.svg
     Resync: bash scripts/sync-brand-assets.sh -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" font-family="Rajdhani, 'Arial Narrow', sans-serif">
  <!-- Organization avatar (GitHub, Discord, socials). The emblem mark, not the
       wordmark: per BRAND_GUIDELINES.md §5 the full lockup needs 48px of height,
       and an avatar is rendered far below that. Square and full-bleed, because
       GitHub composites avatars on a surface of its own choosing. -->
  <defs>
    <radialGradient id="void" cx="0.5" cy="0.45" r="0.72">
      <stop offset="0" stop-color="#1F1233"/>
      <stop offset="0.7" stop-color="#070310"/>
    </radialGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2F3F5"/>
      <stop offset="0.45" stop-color="#B9BEC7"/>
      <stop offset="0.55" stop-color="#6E7480"/>
      <stop offset="1" stop-color="#F2F3F5"/>
    </linearGradient>
    <linearGradient id="volt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B2FE8"/>
      <stop offset="1" stop-color="#B45CFF"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#void)"/>

  <!-- chiseled tile: the shield silhouette, 45° corner cut -->
  <path d="M80 16 H496 V432 L432 496 H16 V80 Z" fill="#0D0718" stroke="#4C1D95" stroke-width="16"/>

  <!-- |A|^ -->
  <text x="64" y="368" font-size="320" font-weight="700" fill="url(#volt)">|</text>
  <text x="144" y="368" font-size="304" font-weight="700" fill="url(#chrome)">A</text>
  <text x="320" y="368" font-size="320" font-weight="700" fill="url(#volt)">|</text>
  <text x="376" y="240" font-size="192" font-weight="700" fill="url(#volt)">^</text>
</svg>
